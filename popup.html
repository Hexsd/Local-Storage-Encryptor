<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Local Storage Encryptor</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <div class="brand"><span class="mark" aria-hidden="true">S</span><div><strong>Local Storage Encryptor</strong><span id="site">Текущая вкладка</span></div></div>
      <button id="power" class="icon-button" type="button" aria-label="Включить или выключить защиту" aria-pressed="true"><span></span></button>
    </header>

    <section class="hero" aria-live="polite">
      <div id="shield" class="shield">✓</div>
      <h1 id="status-title">Защита активна</h1>
      <p id="status-text">Проверяем страницу локально</p>
    </section>

    <section class="metrics" aria-label="Статистика защиты">
      <div><strong id="blocked">0</strong><span>заблокировано</span></div>
      <div><strong id="findings">0</strong><span>сигналов сейчас</span></div>
    </section>

    <section id="finding-list" class="finding-list" hidden></section>

    <div class="actions">
      <button id="scan" class="primary" type="button">Проверить страницу</button>
      <button id="trust" type="button">Доверять сайту</button>
    </div>

    <footer><button id="options" type="button">Настройки и журнал <span>→</span></button></footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
